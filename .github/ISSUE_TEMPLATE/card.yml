name: Card
description: One task for one agent session. The card is the spec.
title: "<verb> <thing>"
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable bullets, including exact CLI input and output.
      placeholder: "- `todo.py undone 3` sets `done` to false and exits 0"
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Which tests to add, and in which file.
      value: "Add pytest tests for the new behaviour in tests/test_<command>.py. Keep existing tests."
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
